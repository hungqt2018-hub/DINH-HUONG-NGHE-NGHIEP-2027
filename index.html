    <script>
      // Mock Vite internal HMR WebSocket client in preview environments where HMR is disabled
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteWebSocket(url, protocols) {
          var isViteHmr = false;
          if (protocols === 'vite-hmr') isViteHmr = true;
          if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
          if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) isViteHmr = true;

          if (isViteHmr) {
            var listeners = {};
            return {
              readyState: 1,
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              url: url,
              protocol: 'vite-hmr',
              addEventListener: function(event, callback) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(callback);
                if (event === 'open') {
                  setTimeout(function() {
                    try { callback({ type: 'open' }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function(event, callback) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                }
              },
              dispatchEvent: function(event) {
                var cbs = listeners[event && event.type] || [];
                for (var i = 0; i < cbs.length; i++) {
                  try { cbs[i](event); } catch (e) {}
                }
                return true;
              },
              send: function() {},
              close: function() {
                this.readyState = 3;
                var closeCbs = listeners['close'] || [];
                for (var j = 0; j < closeCbs.length; j++) {
                  try { closeCbs[j]({ type: 'close', wasClean: true, code: 1000 }); } catch (e) {}
                }
              }
            };
          }
          return new NativeWebSocket(url, protocols);
        }
        MockViteWebSocket.prototype = NativeWebSocket.prototype;
        MockViteWebSocket.CONNECTING = 0;
        MockViteWebSocket.OPEN = 1;
        MockViteWebSocket.CLOSING = 2;
        MockViteWebSocket.CLOSED = 3;
        window.WebSocket = MockViteWebSocket;

        window.addEventListener('error', function(event) {
          if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('vite') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
